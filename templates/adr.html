<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title><!-- ADR-NNN — Decision title --></title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/ShashiSrinath/ai-skill-html-planner@v0.3.0/dist/planner.min.css"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/gh/ShashiSrinath/ai-skill-html-planner@v0.3.0/dist/planner.min.js"
    ></script>
  </head>
  <body>
    <nav class="pl-toc" aria-label="Table of contents"></nav>
    <main>
      <header class="hero">
        <span class="kicker"><!-- e.g. ARCHITECTURE DECISION RECORD --></span>
        <h1><!-- ADR-NNN — Decision title --></h1>
        <p class="lede">
          <!-- 2-3 sentences: what is being decided and the one-line reason it matters now. -->
        </p>
        <div class="meta">
          <span class="badge" data-tone="ok"><!-- Proposed / Accepted / Superseded --></span>
          <span><!-- date --></span>
          <span><!-- Author --></span>
        </div>
      </header>

      <!--
        Build the sections below from scratch, shaped to this decision's actual
        content. There is no fixed section list, order, or count to follow — pick
        only the components from SKILL.md's cheat-sheet (.callout, .steps, .grid +
        .card, .filetree, pre[data-file], .check, .chart-bar/.chart-line, .arch, a
        plain <table> or <dl class="decision">, etc.) that this ADR needs, and skip
        the rest. Common ADR content — context, the decision itself, consequences,
        alternatives considered — is a useful checklist to draw from, not a
        template to copy verbatim.
      -->
    </main>
    <footer class="footer">
      <p class="small muted"><!-- One-line status/date summary. --></p>
    </footer>
  </body>
</html>
